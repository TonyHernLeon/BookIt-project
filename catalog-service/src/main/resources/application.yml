spring:
  application:
    name: catalog-service
  datasource:
    url: jdbc:postgresql://localhost:5433/catalog     # ver docker-compose.yml
    username: catalog
    password: catalog
  jpa:
    hibernate:
      ddl-auto: validate       # Hibernate solo valida, nunca modifica
    open-in-view: false
  flyway:
    enabled: true              # por defecto busca en classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
